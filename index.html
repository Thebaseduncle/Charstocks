<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CharStocks — Character Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0c0c0e; --panel:#141416; --panel2:#1b1b1f; --line:#2a2a30;
  --ink:#f2f0ea; --dim:#8b8b93; --yellow:#ffcf3f; --green:#3ddc84; --red:#ff5a5a; --pink:#ff3d81;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Mono',monospace;min-height:100%;}
h1,h2,.display{font-family:'Anton',sans-serif;letter-spacing:.5px;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

header{border-bottom:1px solid var(--line);padding:18px 20px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;}
.masthead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;}
.masthead h1{font-size:clamp(28px,5vw,42px);margin:0;color:var(--yellow);text-transform:uppercase;}
.masthead .sub{color:var(--dim);font-size:12px;margin-top:2px;}
.headerright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.cash-badge{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:3px;text-align:right;}
.cash-badge .label{font-size:10px;color:var(--dim);text-transform:uppercase;}
.cash-badge .val{font-size:20px;font-weight:600;transition:color .3s ease;}
.worth-up{color:var(--green);} .worth-down{color:var(--red);}
.logout{background:transparent;border:1px solid var(--line);color:var(--dim);}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--panel2);border:1px solid var(--line);cursor:pointer;}
.admin-badge{background:var(--yellow);color:#221800;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;vertical-align:middle;letter-spacing:.3px;}

.slot-reel-window{width:90px;height:90px;overflow:hidden;position:relative;background:var(--panel2);border:2px solid var(--line);border-radius:6px;transition:border-color .3s ease, box-shadow .3s ease;}
.slot-reel-window.win{border-color:var(--yellow);animation:slotGlow .6s ease-in-out 3;}
@keyframes slotGlow{0%,100%{box-shadow:0 0 0 rgba(255,207,63,0);}50%{box-shadow:0 0 18px rgba(255,207,63,.85);}}
.slot-reel-strip{display:flex;flex-direction:column;}
.slot-symbol{width:90px;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0;box-sizing:border-box;padding:6px;}
.slot-symbol img{width:44px;height:44px;object-fit:cover;border-radius:50%;border:1px solid var(--line);}
.slot-symbol-name{font-size:8px;color:var(--dim);max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.ticker-wrap{overflow:hidden;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg, transparent, black 32px, black calc(100% - 32px), transparent);
  mask-image:linear-gradient(90deg, transparent, black 32px, black calc(100% - 32px), transparent);}
.ticker{display:inline-block;padding:8px 0;animation:scroll 40s linear infinite;}
.ticker span{margin:0 18px;font-size:13px;}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

.headline-bar{background:var(--pink);color:#1a0510;font-weight:600;font-size:13px;padding:0 20px;max-height:0;opacity:0;overflow:hidden;transition:max-height .32s ease, opacity .28s ease, padding .32s ease;}
.headline-bar.show{max-height:60px;opacity:1;padding:9px 20px;}
.headline-bar.crash{background:var(--red);color:#210;}
.headline-bar.boom{background:var(--green);color:#032;}

main{max-width:1100px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:1fr;gap:26px;}
@media(min-width:880px){main{grid-template-columns:2fr 1fr;}}

.section-title{font-size:14px;text-transform:uppercase;color:var(--dim);letter-spacing:1px;margin:0 0 12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;transition:transform .15s ease, border-color .15s ease, background-color .15s ease;}
.card:hover{transform:translateY(-3px);border-color:var(--dim);}
.card-img{width:100%;height:230px;object-fit:cover;border-radius:3px;margin-bottom:10px;background:var(--panel2);transition:transform .25s ease;cursor:pointer;}
.card .name{font-weight:600;font-size:14px;cursor:pointer;}
.card .name:hover{color:var(--yellow);}
.card:hover .card-img{transform:scale(1.03);}
@keyframes flashUp{from{background-color:rgba(61,220,132,.28);}to{background-color:var(--panel);}}
@keyframes flashDown{from{background-color:rgba(255,90,90,.28);}to{background-color:var(--panel);}}
.card.flash-up{animation:flashUp 1.1s ease-out;}
.card.flash-down{animation:flashDown 1.1s ease-out;}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.card .cat{font-size:10px;color:var(--dim);}
.card .price{font-size:22px;font-weight:600;margin-top:6px;transition:color .2s ease;}
.card .chg{font-size:12px;margin-top:2px;}
.up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--dim);}
.card .actions{display:flex;gap:6px;margin-top:10px;}
.card input[type=number]{width:56px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:5px;border-radius:3px;font-family:inherit;}
button{cursor:pointer;font-family:inherit;border:none;border-radius:3px;padding:6px 10px;font-size:12px;font-weight:600;transition:transform .08s ease, filter .15s ease, opacity .15s ease;}
button:hover:not(:disabled){filter:brightness(1.12);}
button:active:not(:disabled){transform:scale(.95);}
.buy{background:var(--green);color:#032;}
.sell{background:var(--red);color:#210;}
.rename{background:transparent;color:var(--dim);border:1px solid var(--line);padding:2px 6px;font-size:11px;}
.rename:hover{color:var(--ink);border-color:var(--dim);}
.lb-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.lb-row:last-child{border-bottom:none;}
.lb-rank{color:var(--dim);margin-right:8px;}
button:disabled{opacity:.4;cursor:not-allowed;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;}
.holding{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.holding:last-child{border-bottom:none;}
.holding .pl{font-size:11px;}
.empty{color:var(--dim);font-size:13px;}

.addform{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;}
.addform input,.addform select{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:3px;font-family:inherit;font-size:13px;}
.addform input[type=text]{flex:1;min-width:120px;}
.addform button{background:var(--yellow);color:#221800;}


.board-section{max-width:1100px;margin:0 auto;padding:18px 20px 0;}
.message-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;}
.message-list .msg-row{border-bottom:1px solid var(--line);padding-bottom:8px;animation:msgIn .25s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.message-list .msg-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);}
.msg-sender{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink);font-weight:600;}
.msg-sender:hover{color:var(--yellow);}
.msg-avatar{width:20px;height:20px;}
.message-list .msg-body{font-size:13px;margin-top:2px;line-height:1.45;}
.msg-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;padding:0;}
.board-input-row{display:flex;gap:8px;margin-top:12px;}
.board-input-row input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:3px;font-family:inherit;font-size:13px;transition:border-color .15s ease;}
.board-input-row input:focus{outline:none;border-color:var(--yellow);}
.board-send{background:var(--yellow);color:#221800;}

.race-progress-bg{background:var(--panel2);border-radius:3px;height:6px;overflow:hidden;margin-bottom:14px;}
.race-progress-fill{height:100%;background:var(--yellow);transition:width 1s linear, background-color .4s ease;}
.race-track-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.race-track-name{width:110px;font-size:12px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.race-track-bg{flex:1;background:var(--panel2);border-radius:3px;height:20px;position:relative;overflow:hidden;}
.race-track-fill{height:100%;border-radius:3px;transition:width .25s linear, background-color .4s ease;
  background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0, rgba(255,255,255,.22) 8px, transparent 8px, transparent 18px);
  background-size:26px 26px;
  animation:raceStripes .7s linear infinite;}
@keyframes raceStripes{from{background-position:0 0;}to{background-position:26px 0;}}
.race-track-marker{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:15px;transition:left .25s linear;animation:horseBob .5s ease-in-out infinite;}
@keyframes horseBob{0%,100%{margin-top:0;}50%{margin-top:-3px;}}
.race-track-row:nth-child(2n) .race-track-marker{animation-duration:.6s;}
.race-track-row:nth-child(3n) .race-track-marker{animation-duration:.45s;animation-delay:.1s;}
.race-track-row:nth-child(5n) .race-track-marker{animation-duration:.55s;animation-delay:.2s;}
#raceHorses.race-finished .race-track-fill{animation:none;}
#raceHorses.race-finished .race-track-marker{animation:none;}
#raceHorses.race-finished .race-track-row.winner .race-track-marker{animation:horseBob .5s ease-in-out infinite;}
.race-track-pct{width:56px;text-align:right;font-size:12px;flex-shrink:0;}
.race-track-row.winner .race-track-name{color:var(--yellow);font-weight:700;}

#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.authcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px;width:100%;max-width:340px;}
.authcard h1{color:var(--yellow);font-size:28px;margin:0 0 4px;text-transform:uppercase;}
.authcard .sub{color:var(--dim);font-size:12px;margin-bottom:20px;}
.authcard label{display:block;font-size:11px;color:var(--dim);margin:12px 0 4px;text-transform:uppercase;}
.authcard input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:9px 10px;border-radius:3px;font-family:inherit;font-size:14px;}
.authcard .tabs{display:flex;gap:6px;margin-bottom:6px;}
.authcard .tabs button{flex:1;background:var(--panel2);color:var(--dim);border:1px solid var(--line);padding:8px;}
.authcard .tabs button.active{background:var(--yellow);color:#221800;border-color:var(--yellow);}
.authcard .go{width:100%;margin-top:18px;background:var(--green);color:#032;padding:10px;font-size:13px;}
.authcard .msg{margin-top:12px;font-size:12px;color:var(--pink);min-height:16px;}
#appScreen{display:none;}
@keyframes appIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
#appScreen.app-enter{animation:appIn .4s ease;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  .card:hover{transform:none;}
}
</style>
</head>
<body>

<div id="authScreen">
  <div class="authcard">
    <h1>CharStocks</h1>
    <div class="tabs">
      <button id="tabSignIn" class="active" onclick="setAuthMode('signin')">Sign In</button>
      <button id="tabSignUp" onclick="setAuthMode('signup')">Create Account</button>
    </div>
    <label>Username</label>
    <input type="text" id="authUsername" autocomplete="username" maxlength="20">
    <label>Password</label>
    <input type="password" id="authPassword" autocomplete="current-password">
    <button class="go" id="authGo" onclick="submitAuth()">Sign In</button>
    <div class="msg" id="authMsg"></div>
  </div>
</div>

<div id="appScreen">
<header>
  <div class="masthead">
    <div><h1>CharStocks</h1></div>
    <div class="headerright">
      <img id="avatarImg" class="avatar" onclick="toggleProfileEditor()" title="Edit profile">
      <span id="whoami" class="sub" onclick="toggleProfileEditor()" style="cursor:pointer;"></span>
      <button class="logout" onclick="toggleMessageBoard()">💬 Messages</button>
      <button class="logout" onclick="toggleRacePanel()">🏇 Steel Stock Run</button>
      <button class="logout" onclick="toggleSlotsPanel()">🎰 The Kirkinator</button>
      <button class="logout" onclick="toggleDuelPanel()">⚔️ Duel</button>
      <button class="logout" onclick="signOut()">Log out</button>
      <div class="cash-badge"><div class="label">Net Worth</div><div class="val" id="netWorth">$0</div></div>
    </div>
  </div>
</header>

<div class="ticker-wrap"><div class="ticker" id="ticker"></div></div>
<div class="headline-bar" id="headlineBar"></div>

<div class="panel" id="profileEditor" style="display:none;max-width:1100px;margin:16px auto 0;">
  <div class="section-title" style="margin-bottom:8px;">Your Profile</div>
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
    <img id="avatarPreview" class="avatar" style="width:56px;height:56px;">
    <div style="flex:1;min-width:180px;">
      <label style="display:block;font-size:11px;color:var(--dim);margin-bottom:4px;">Display name</label>
      <input type="text" id="profileNameInput" maxlength="40" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:3px;font-family:inherit;font-size:13px;">
    </div>
    <div>
      <label style="display:block;font-size:11px;color:var(--dim);margin-bottom:4px;">Profile picture</label>
      <input type="file" id="avatarFile" accept="image/*" onchange="previewAvatarFile()">
    </div>
  </div>
  <div style="display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;">
    <div style="flex:2;min-width:220px;">
      <label style="display:block;font-size:11px;color:var(--dim);margin-bottom:4px;">Bio</label>
      <input type="text" id="profileBioInput" maxlength="140" placeholder="A short line about you" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:3px;font-family:inherit;font-size:13px;">
    </div>
    <div style="flex:1;min-width:160px;">
      <label style="display:block;font-size:11px;color:var(--dim);margin-bottom:4px;">Favorite stock</label>
      <select id="profileFavSelect" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:3px;font-family:inherit;font-size:13px;">
        <option value="">None</option>
      </select>
    </div>
  </div>
  <div style="display:flex;gap:14px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);flex-wrap:wrap;align-items:flex-end;">
    <div style="flex:1;min-width:200px;">
      <label style="display:block;font-size:11px;color:var(--dim);margin-bottom:4px;">Change password</label>
      <input type="password" id="newPasswordInput" placeholder="New password" autocomplete="new-password" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:3px;font-family:inherit;font-size:13px;">
    </div>
    <button style="background:var(--panel2);color:var(--ink);border:1px solid var(--line);" onclick="changePassword()">Change Password</button>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end;">
    <button style="background:var(--green);color:#032;" onclick="saveProfile()">Save</button>
    <button style="background:transparent;border:1px solid var(--line);color:var(--dim);" onclick="toggleProfileEditor()">Close</button>
  </div>
  <div class="msg" id="profileMsg" style="margin-top:8px;font-size:12px;color:var(--pink);"></div>
</div>

<div class="panel" id="messageBoard" style="display:none;max-width:1100px;margin:16px auto 0;">
  <div class="section-title" style="margin-bottom:8px;">Message Board</div>
  <div id="messageList" class="message-list"></div>
  <div class="board-input-row">
    <input type="text" id="messageInput" maxlength="500" placeholder="Say something to the exchange..." onkeydown="if(event.key==='Enter') sendMessage();">
    <button class="board-send" onclick="sendMessage()">Send</button>
  </div>
</div>

<div class="panel" id="racePanel" style="display:none;max-width:1100px;margin:16px auto 0;">
  <div class="section-title" style="margin-bottom:8px;">The Steel Stock Run 🏇</div>
  <div id="raceStatus" style="font-size:13px;margin-bottom:10px;"></div>
  <div class="race-progress-bg"><div class="race-progress-fill" id="raceProgressFill" style="width:0%;"></div></div>
  <div id="raceHorses" style="display:flex;flex-direction:column;gap:2px;margin-bottom:14px;"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <select id="raceHorseSelect" style="flex:1;min-width:140px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:3px;font-family:inherit;font-size:13px;"></select>
    <input type="number" id="raceBetAmount" min="1" step="1" placeholder="Bet amount" style="width:130px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:3px;font-family:inherit;font-size:13px;">
    <button style="background:var(--yellow);color:#221800;" onclick="placeBet()">Place Bet</button>
  </div>
  <div class="msg" id="raceMsg" style="margin-top:8px;font-size:12px;color:var(--pink);"></div>
</div>

<div class="panel" id="slotsPanel" style="display:none;max-width:1100px;margin:16px auto 0;">
  <div class="section-title" style="margin-bottom:10px;">The Kirkinator 🎰</div>
  <div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px;">
    <div class="slot-reel-window" id="slotReel0"><div class="slot-reel-strip" id="slotStrip0"></div></div>
    <div class="slot-reel-window" id="slotReel1"><div class="slot-reel-strip" id="slotStrip1"></div></div>
    <div class="slot-reel-window" id="slotReel2"><div class="slot-reel-strip" id="slotStrip2"></div></div>
  </div>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
    <input type="number" id="slotBetAmount" min="1" step="1" value="10" placeholder="Bet amount" style="width:130px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:9px 10px;border-radius:3px;font-family:inherit;font-size:13px;">
    <button id="slotSpinBtn" style="background:var(--yellow);color:#221800;font-size:14px;padding:10px 26px;" onclick="spinSlots()">🎰 Spin</button>
  </div>
  <div class="sub" style="text-align:center;margin-top:8px;font-size:11px;">Match 3 of the same stock to win — each stock pays a fixed jackpot, scaled by your bet.</div>
  <div class="msg" id="slotMsg" style="margin-top:8px;font-size:13px;text-align:center;color:var(--dim);"></div>
</div>

<div class="panel" id="duelPanel" style="display:none;max-width:1100px;margin:16px auto 0;">
  <div class="section-title" style="margin-bottom:10px;">1v1 Duel ⚔️</div>
  <div id="duelContent"></div>
  <div class="section-title" style="margin-top:16px;margin-bottom:8px;">Most Duel Wins</div>
  <div id="duelLeaderboard"></div>
</div>

<div id="viewProfileOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:20px;">
  <div class="panel" id="viewProfileCard" style="max-width:360px;width:100%;"></div>
</div>

<section style="max-width:1100px;margin:16px auto 0;padding:0 20px;">
  <div class="section-title">Your Portfolio</div>
  <div class="panel" id="portfolio" style="border-color:var(--green);"></div>
</section>

<main>
  <div>
    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Listed Characters</span>
      <select id="stockSortSelect" onchange="render()" style="background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:5px 8px;border-radius:3px;font-family:inherit;font-size:11px;text-transform:none;letter-spacing:normal;">
        <option value="default">Default order</option>
        <option value="up">Biggest gainers first</option>
        <option value="down">Biggest losers first</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>

    <div class="addform" id="addForm" style="display:none;">
      <input type="text" id="newName" placeholder="Character name (e.g. Your Cat)">
      <select id="newCat">
        <option>Meme</option><option>Screen</option><option>Historical</option><option>Other</option>
      </select>
      <input type="file" id="newImage" accept="image/*" style="max-width:160px;">
      <button onclick="addCharacter()">List on Exchange</button>
    </div>
  </div>

  <div>
    <div class="panel" id="adminPanel" style="display:none;margin-bottom:22px;border-color:var(--yellow);">
      <div class="section-title" style="color:var(--yellow);margin-bottom:8px;">Admin</div>
      <label style="display:block;font-size:11px;color:var(--dim);margin-bottom:4px;">Post a headline to everyone</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="adminHeadline" placeholder="e.g. Market crash incoming" style="flex:1;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:3px;font-family:inherit;font-size:13px;">

async function trade(id, dir){
  if(!myId) return;
  const c = market.characters.find(x=>x.id===id);
  const qtyInput = document.getElementById('qty-'+id);
  const qty = Math.max(1, parseInt(qtyInput.value)||1);
  if(dir===1){
    const { data, error } = await sb.rpc('buy_stock', { p_character_id: id, p_qty: qty });
    if(error){ flashHeadline(error.message); return; }
    flashHeadline(`Bought ${qty} × ${c.name} for ${fmt(data.cost)} (avg ${fmt(data.avg_price)}/share) — price now ${fmt(data.new_price)}.`);
  } else {
    const { data, error } = await sb.rpc('sell_stock', { p_character_id: id, p_qty: qty });
    if(error){ flashHeadline(error.message); return; }
    flashHeadline(`Sold ${qty} × ${c.name} for ${fmt(data.proceeds)} (avg ${fmt(data.avg_price)}/share) — price now ${fmt(data.new_price)}.`);
  }
  // Don't rely solely on realtime push reaching us — refetch directly so the
  // acting user's own view is always correct even if a websocket event is missed.
  await Promise.all([loadPortfolio(), loadMarket()]);
}
async function renameCharacter(id){
  const c = market.characters.find(x=>x.id===id);

}

  const nameInput = document.getElementById('newName');
  const name = nameInput.value.trim();
  if(!name) return;
  const cat = document.getElementById('newCat').value;

    let blob;
    try{ blob = await resizeImageToBlob(file, 640, 480); }

let inQueue = false;
let queueCount = 0;

function computeNetWorthFromCache(userId){
  const port = leaderboardPortfolios.find(p => p.user_id === userId);
  if(!port) return null;
  let nw = Number(port.cash) || 0;
  Object.entries(port.holdings || {}).forEach(([cid, h])=>{
    const c = market.characters.find(x => x.id === cid);
    if(c && h.qty) nw += h.qty * c.price;
  });
  return nw;
}
async function loadDuelState(isInitial){
  const { data: duel } = await sb.from('duels').select('*')
    .or(`player1_id.eq.${myId},player2_id.eq.${myId}`)
    .order('id', { ascending: false }).limit(1).maybeSingle();
  currentDuel = duel || null;
  const { data: q } = await sb.from('matchmaking_queue').select('user_id').eq('user_id', myId).maybeSingle();
  inQueue = !!q;
  const { data: allQueue } = await sb.from('matchmaking_queue').select('user_id');
  queueCount = (allQueue || []).length;

  if(isInitial){
    duelNotified = currentDuel ? currentDuel.id : null;
  } else if(currentDuel && currentDuel.status === 'finished' && duelNotified !== currentDuel.id){
    duelNotified = currentDuel.id;
    const iAmP1 = currentDuel.player1_id === myId;
    const myGain = (iAmP1 ? currentDuel.final_net_worth1 - currentDuel.start_net_worth1 : currentDuel.final_net_worth2 - currentDuel.start_net_worth2);
    const oppGain = (iAmP1 ? currentDuel.final_net_worth2 - currentDuel.start_net_worth2 : currentDuel.final_net_worth1 - currentDuel.start_net_worth1);
    if(currentDuel.winner_id === myId){
      flashHeadline(`⚔️ You won your duel! You made ${fmt(myGain)} vs their ${fmt(oppGain)} — you keep it all.`, 'boom');
    } else if(currentDuel.winner_id === null){
      flashHeadline(`⚔️ Your duel ended in a tie — both made ${fmt(myGain)}, no clawback either way.`, 'news');
    } else {
      const clawbackNote = myGain > 0 ? ` Since you lost, that gain was clawed back.` : '';
      flashHeadline(`⚔️ You lost your duel. You made ${fmt(myGain)} vs their ${fmt(oppGain)}.${clawbackNote}`, 'crash');
    }
  }
  renderDuel();
  loadDuelLeaderboard();
}
async function loadDuelLeaderboard(){
  const el = document.getElementById('duelLeaderboard');
  if(!el) return;
  const { data } = await sb.from('duels').select('winner_id').not('winner_id', 'is', null);
  const counts = {};
  (data || []).forEach(d => { counts[d.winner_id] = (counts[d.winner_id] || 0) + 1; });
  const rows = Object.entries(counts).map(([uid, wins])=>{
    const p = leaderboardProfiles[uid] || profilesCache[uid] || {};
    return { user_id: uid, display_name: p.display_name || 'Trader', avatar_url: p.avatar_url, wins };
  }).sort((a,b) => b.wins - a.wins).slice(0, 10);
  el.innerHTML = rows.length ? rows.map((r,i)=>`
    <div class="holding" style="cursor:pointer;" onclick="openProfileView('${r.user_id}')">
      <span style="display:flex;align-items:center;gap:8px;">
        <span style="width:18px;color:var(--dim);font-size:12px;">${i+1}</span>
        <img src="${r.avatar_url || DEFAULT_AVATAR}" class="avatar msg-avatar">
        ${escapeHtml(r.display_name)}${adminBadge(r.user_id)}
      </span>
      <span>${r.wins} win${r.wins===1?'':'s'}</span>
    </div>`).join('') : '<div class="empty">No duels finished yet.</div>';
}
function subscribeDuel(){
  if(duelSubscribed) return;
  duelSubscribed = true;
  sb.channel('duel-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'duels'}, ()=>loadDuelState())
    .on('postgres_changes', {event:'*', schema:'public', table:'matchmaking_queue'}, ()=>loadDuelState())
    .subscribe();
  setInterval(()=>{
    renderDuel();
    if(currentDuel && currentDuel.status === 'active'){
      const secsLeft = Math.round((new Date(currentDuel.ends_at).getTime() - Date.now()) / 1000);
      if(secsLeft <= 0) loadDuelState();
    }
  }, 1000);
}
function renderDuel(){
  const panel = document.getElementById('duelContent');
  if(!panel) return;

  if(currentDuel && currentDuel.status === 'active'){
    const iAmP1 = currentDuel.player1_id === myId;
    const oppId = iAmP1 ? currentDuel.player2_id : currentDuel.player1_id;
    const myStart = iAmP1 ? currentDuel.start_net_worth1 : currentDuel.start_net_worth2;
    const oppStart = iAmP1 ? currentDuel.start_net_worth2 : currentDuel.start_net_worth1;
    const myNow = computeNetWorthFromCache(myId) ?? myStart;
    const oppNow = computeNetWorthFromCache(oppId) ?? oppStart;
    const myGain = myNow - myStart;
    const oppGain = oppNow - oppStart;
    const oppProfile = leaderboardProfiles[oppId] || {};
    const secsLeft = Math.max(0, Math.round((new Date(currentDuel.ends_at).getTime() - Date.now()) / 1000));
    const statusLine = secsLeft > 0 ? `⚔️ Duel in progress — ${secsLeft}s left` : `⏳ Time's up — settling final results…`;
    if(secsLeft <= 0 && !duelSettling){
      duelSettling = true;
      sb.rpc('settle_due_duels').then(()=>{ duelSettling = false; loadDuelState(); });
    }
    panel.innerHTML = `
      <div style="text-align:center;font-size:13px;margin-bottom:12px;">${statusLine}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <div style="flex:1;text-align:center;">
          <div style="font-weight:600;">You</div>
          <div class="${myGain>=0?'up':'down'}" style="font-size:20px;">${myGain>=0?'+':''}${fmt(myGain)}</div>
        </div>
        <div style="color:var(--dim);font-size:12px;">VS</div>
        <div style="flex:1;text-align:center;">
          <div style="font-weight:600;">${escapeHtml(oppProfile.display_name || 'Opponent')}${adminBadge(oppId)}</div>
          <div class="${oppGain>=0?'up':'down'}" style="font-size:20px;">${oppGain>=0?'+':''}${fmt(oppGain)}</div>
        </div>
      </div>`;
    return;
  }

  if(inQueue){
    panel.innerHTML = `
      <div style="text-align:center;">
        <div class="sub" style="margin-bottom:10px;">Searching for an opponent… (${queueCount} in queue)</div>
        <button style="background:transparent;border:1px solid var(--line);color:var(--dim);" onclick="leaveDuelQueue()">Cancel</button>
      </div>`;
    return;
  }

  let resultLine = '';
  if(currentDuel && currentDuel.status === 'finished'){
    const iAmP1 = currentDuel.player1_id === myId;
    const myGain = (iAmP1 ? currentDuel.final_net_worth1 - currentDuel.start_net_worth1 : currentDuel.final_net_worth2 - currentDuel.start_net_worth2);
    const oppGain = (iAmP1 ? currentDuel.final_net_worth2 - currentDuel.start_net_worth2 : currentDuel.final_net_worth1 - currentDuel.start_net_worth1);
    const oppId = iAmP1 ? currentDuel.player2_id : currentDuel.player1_id;
    const oppProfile = leaderboardProfiles[oppId] || {};
    const result = currentDuel.winner_id === myId ? 'You won!' : (currentDuel.winner_id === null ? 'Tied' : 'You lost.');
    resultLine = `<div class="sub" style="text-align:center;margin-bottom:12px;">Last duel vs ${escapeHtml(oppProfile.display_name || 'opponent')}: ${result} (${myGain>=0?'+':''}${fmt(myGain)} vs ${oppGain>=0?'+':''}${fmt(oppGain)})</div>`;
  }
  panel.innerHTML = `${resultLine}<div style="text-align:center;">
    <button style="background:var(--yellow);color:#221800;" onclick="joinDuelQueue()">⚔️ Find an Opponent ($100 entry)</button>
    <div class="sub" style="margin-top:6px;font-size:10px;">Winner keeps everything they gain — the loser forfeits any profit made during the duel.</div>
    <div class="sub" style="margin-top:8px;">${queueCount} player${queueCount===1?'':'s'} searching</div>
  </div>`;
}

function resizeImageToBlob(file, targetW, targetH, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file.'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not read image.'));
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = targetW; canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(targetW / img.width, targetH / img.height);
        const sw = targetW / scale, sh = targetH / scale;
        const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Could not resize image.')), 'image/jpeg', quality || 0.86);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const SLOT_ITEM_HEIGHT = 90;

const SLOT_LAND_INDEX = 18;

  return `<div class="slot-symbol"><img src="${img}"><div class="slot-symbol-name">${escapeHtml(sym.name || '???')}</div></div>`;

function buildReelStrip(stripEl, pool, finalSym){
  const items = [];
  for(let i=0;i<SLOT_STRIP_LEN;i++){
    items.push(i === SLOT_LAND_INDEX ? finalSym : pool[Math.floor(Math.random()*pool.length)]);
  }
  stripEl.style.transition = 'none';
  stripEl.style.transform = 'translateY(0px)';
  stripEl.innerHTML = items.map(slotSymbolHtml).join('');
  void stripEl.offsetHeight;
}
function landReel(stripEl, duration){
  stripEl.style.transition = `transform ${duration}s cubic-bezier(.17,.67,.16,1.0)`;
  stripEl.style.transform = `translateY(-${SLOT_LAND_INDEX*SLOT_ITEM_HEIGHT}px)`;

async function spinSlots(){
  if(slotSpinning) return;
  const msg = document.getElementById('slotMsg');
  const btn = document.getElementById('slotSpinBtn');
  const betAmount = parseFloat(document.getElementById('slotBetAmount').value);
  if(!betAmount || betAmount <= 0){
    msg.style.color = 'var(--pink)';
    msg.textContent = 'Enter a bet amount.';
    return;
  }
  msg.style.color = 'var(--dim)';
  msg.textContent = 'Spinning…';
  btn.disabled = true;

  const { data: result, error } = await sb.rpc('spin_slots', { p_bet_amount: betAmount });
  if(error){
    msg.style.color = 'var(--pink)';
    msg.textContent = error.message;
    btn.disabled = false;
    return;
  }

  slotSpinning = true;
  const pool = market.characters.length
    ? market.characters.map(c => ({ id:c.id, name:c.name, image_url:c.image_url }))
    : [{ id:'x', name:'???', image_url: DEFAULT_CARD_IMG }];

  const strips = [document.getElementById('slotStrip0'), document.getElementById('slotStrip1'), document.getElementById('slotStrip2')];
  const windows = [document.getElementById('slotReel0'), document.getElementById('slotReel1'), document.getElementById('slotReel2')];
  windows.forEach(w => w.classList.remove('win'));

  result.reels.forEach((r,i) => buildReelStrip(strips[i], pool, r));

  requestAnimationFrame(()=>{
    landReel(strips[0], 1.1);
    landReel(strips[1], 1.5);
    landReel(strips[2], 1.9);
  });

  setTimeout(()=>{
    slotSpinning = false;
    btn.disabled = false;
    if(result.won){
      windows.forEach(w => w.classList.add('win'));
      msg.style.color = 'var(--green)';

      msg.textContent = 'No match this time — spin again!';

  }, 2000);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let notifiedRaceId = null;
let raceRowEls = {};
let raceStructureId = 'unset';

function hashSeed(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h;
}
function seededWave(seed, t){
  const f1 = 0.12 + (seed % 97)/400;
  const f2 = 0.31 + ((seed >>> 4) % 89)/500;
  const f3 = 0.53 + ((seed >>> 8) % 61)/700;
  const p1 = (seed % 628)/100;
  const p2 = ((seed >>> 5) % 628)/100;
  const p3 = ((seed >>> 9) % 628)/100;
  return Math.sin(t*f1+p1)*0.5 + Math.sin(t*f2+p2)*0.3 + Math.sin(t*f3+p3)*0.2;
}
function raceHorseList(){
  if(!currentRace) return [];
  const startPrices = currentRace.start_prices || {};
  return Object.keys(startPrices).map(cid=>{
    const c = market.characters.find(x => x.id === cid);
    if(!c) return null;
    const startP = Number(startPrices[cid]);
    const realPct = startP > 0 ? ((c.price - startP) / startP * 100) : 0;
    return { id: cid, name: c.name, realPct };
  }).filter(Boolean);
}
function buildRaceStructure(){
  const horsesEl = document.getElementById('raceHorses');
  const horses = raceHorseList().sort((a,b) => a.name.localeCompare(b.name));
  raceRowEls = {};
  horsesEl.classList.remove('race-finished');
  horsesEl.innerHTML = horses.map(h => `
    <div class="race-track-row" id="race-row-${h.id}">
      <div class="race-track-name">${escapeHtml(h.name)}</div>
      <div class="race-track-bg">
        <div class="race-track-fill" id="race-fill-${h.id}" style="width:50%;background-color:var(--green);"></div>
        <div class="race-track-marker" id="race-marker-${h.id}" style="left:50%;">🐎</div>
      </div>
      <div class="race-track-pct" id="race-pct-${h.id}"></div>
    </div>`).join('');
  horses.forEach(h=>{
    raceRowEls[h.id] = {
      rowEl: document.getElementById('race-row-'+h.id),
      fillEl: document.getElementById('race-fill-'+h.id),
      markerEl: document.getElementById('race-marker-'+h.id),
      pctEl: document.getElementById('race-pct-'+h.id)
    };
  });
  raceStructureId = currentRace ? currentRace.id : null;
}
function updateRaceVisual(){
  if(!currentRace || currentRace.status !== 'open') return;
  const horses = raceHorseList();
  if(!horses.length) return;

  const ranked = [...horses].sort((a,b) => b.realPct - a.realPct);
  const n = ranked.length;
  const rankScore = {};
  ranked.forEach((h,i) => { rankScore[h.id] = n > 1 ? (n-1-i)/(n-1) : 1; });

  const nowMs = Date.now();
  const startedAt = new Date(currentRace.created_at).getTime();
  const endsAt = new Date(currentRace.ends_at).getTime();
  const totalMs = Math.max(1, endsAt - startedAt);
  const frac = Math.min(1, Math.max(0, (nowMs - startedAt) / totalMs));
  const bias = frac * frac;
  const tSec = (nowMs - startedAt) / 1000;

  const values = horses.map(h=>{
    const seed = hashSeed(currentRace.id + '-' + h.id);
    const noise = seededWave(seed, tSec);
    const score = noise * (1 - bias) + (rankScore[h.id] * 2 - 1) * bias;
    return { id: h.id, score, realPct: h.realPct };
  });
  const scores = values.map(v => v.score);
  const minS = Math.min(...scores), maxS = Math.max(...scores);
  const spread = (maxS - minS) || 1;

  values.forEach(v=>{
    const refs = raceRowEls[v.id];
    if(!refs) return;
    const norm = Math.max(4, ((v.score - minS) / spread) * 100);
    refs.fillEl.style.width = norm + '%';
    refs.markerEl.style.left = norm + '%';
    const dir = v.realPct >= 0 ? 'up' : 'down';
    refs.pctEl.className = 'race-track-pct ' + dir;
    refs.pctEl.textContent = (v.realPct >= 0 ? '+' : '') + v.realPct.toFixed(1) + '%';
  });
}
function renderRaceSettled(){
  const horses = raceHorseList();
  const pcts = horses.map(h => h.realPct);
  const minPct = Math.min(...pcts, 0), maxPct = Math.max(...pcts, 0.01);
  const spread = (maxPct - minPct) || 1;
  horses.forEach(h=>{
    const refs = raceRowEls[h.id];
    if(!refs) return;
    const isWinner = h.id === currentRace.winner_character_id;
    const norm = isWinner ? 100 : Math.max(4, ((h.realPct - minPct) / spread) * 100);
    refs.fillEl.style.width = norm + '%';
    refs.fillEl.style.backgroundColor = isWinner ? 'var(--yellow)' : (h.realPct >= 0 ? 'var(--green)' : 'var(--red)');
    refs.markerEl.style.left = norm + '%';
    refs.markerEl.textContent = isWinner ? '🏆' : '🐎';
    refs.rowEl.classList.toggle('winner', isWinner);
    const dir = h.realPct >= 0 ? 'up' : 'down';
    refs.pctEl.className = 'race-track-pct ' + dir;
    refs.pctEl.textContent = (h.realPct >= 0 ? '+' : '') + h.realPct.toFixed(1) + '%';
  });
}
async function loadRace(isInitial){
  const { data } = await sb.from('races').select('*').order('id', { ascending: false }).limit(1).maybeSingle();
  currentRace = data || null;
  if(currentRace && myId){
    const { data: bet } = await sb.from('race_bets').select('*').eq('race_id', currentRace.id).eq('user_id', myId).maybeSingle();
    myBet = bet || null;
  } else {
    myBet = null;
  }
  if(isInitial){
    notifiedRaceId = currentRace ? currentRace.id : null;
  } else {
    maybeNotifyRaceResult();
  }
  renderRace();
}
function maybeNotifyRaceResult(){
  if(!currentRace || currentRace.status !== 'settled' || !myBet) return;
  if(notifiedRaceId === currentRace.id) return;
  notifiedRaceId = currentRace.id;
  const payout = Number(myBet.payout || 0);
  const stake = Number(myBet.amount);
  const horseName = market.characters.find(c => c.id === myBet.character_id)?.name || 'your pick';
  if(payout > stake){
    flashHeadline(`🏆 ${horseName} won the Steel Stock Run! You collected ${fmt(payout)} on a ${fmt(stake)} bet.`, 'boom');
  } else if(payout === stake){
    flashHeadline(`Nobody backed the winner — your ${fmt(stake)} bet on ${horseName} was refunded.`, 'news');
  } else {
    flashHeadline(`${horseName} didn't win. You lost your ${fmt(stake)} bet.`, 'crash');
  }
}
function subscribeRace(){
  if(raceSubscribed) return;
  raceSubscribed = true;
  sb.channel('races-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'races'}, ()=>loadRace())
    .on('postgres_changes', {event:'*', schema:'public', table:'race_bets'}, ()=>loadRace())
    .subscribe();
  setInterval(renderRace, 1000);
  setInterval(updateRaceVisual, 200);
}
function renderRace(){
  const statusEl = document.getElementById('raceStatus');
  const horsesEl = document.getElementById('raceHorses');
  const sel = document.getElementById('raceHorseSelect');
  const progressFill = document.getElementById('raceProgressFill');
  if(!statusEl) return;
  if(!currentRace){
    statusEl.textContent = 'Waiting for the next race to start…';
    horsesEl.innerHTML = '';
    raceRowEls = {};
    raceStructureId = null;
    progressFill.style.width = '0%';
    return;
  }
  if(raceStructureId !== currentRace.id){
    buildRaceStructure();
  }

  const now = Date.now();
  const endsAt = new Date(currentRace.ends_at).getTime();
  const startedAt = new Date(currentRace.created_at).getTime();
  const settled = currentRace.status === 'settled';

  const totalMs = Math.max(1, endsAt - startedAt);
  const elapsedPct = settled ? 100 : Math.min(100, Math.max(0, ((now - startedAt) / totalMs) * 100));
  progressFill.style.width = elapsedPct + '%';
  progressFill.style.background = settled ? 'var(--yellow)' : 'var(--green)';
  document.getElementById('raceHorses').classList.toggle('race-finished', settled);

  if(settled){
    const winner = market.characters.find(c => c.id === currentRace.winner_character_id);
    let line = winner ? `🏁 ${escapeHtml(winner.name)} won the Steel Stock Run!` : '🏁 Race finished.';
    if(myBet){
      const payout = Number(myBet.payout || 0);
      line += payout > Number(myBet.amount) ? ` You won ${fmt(payout)}!` : (payout > 0 ? ' Bet refunded.' : ' You lost your bet.');
    }
    if(currentRace.settled_at){
      const nextAt = new Date(currentRace.settled_at).getTime() + 60000;
      const secsToNext = Math.max(0, Math.round((nextAt - now) / 1000));
      line += secsToNext > 0 ? ` Next race in ${secsToNext}s…` : ' Next race starting any moment…';
    } else {
      line += ' Next race starting shortly…';
    }
    statusEl.textContent = line;
    renderRaceSettled();
  } else {
    const secsLeft = Math.max(0, Math.round((endsAt - now) / 1000));
    let line = `🏇 Race in progress — ${secsLeft}s left`;
    if(myBet){
      const horseName = market.characters.find(c => c.id === myBet.character_id)?.name || '?';
      line += ` — you bet ${fmt(myBet.amount)} on ${escapeHtml(horseName)}`;
    }
    statusEl.textContent = line;
    updateRaceVisual();
  }

  if(sel){
    const prevVal = sel.value;
    const horses = raceHorseList().sort((a,b) => a.name.localeCompare(b.name));
    sel.innerHTML = horses.map(h => `<option value="${h.id}">${escapeHtml(h.name)}</option>`).join('');
    if(horses.some(h => h.id === prevVal)) sel.value = prevVal;
  }
}
async function placeBet(){
  const msg = document.getElementById('raceMsg');
  msg.style.color = 'var(--pink)';
  const characterId = document.getElementById('raceHorseSelect').value;
  const amount = parseFloat(document.getElementById('raceBetAmount').value);
  if(!characterId){ msg.textContent = 'Pick a horse to bet on.'; return; }
  if(!amount || amount <= 0){ msg.textContent = 'Enter a bet amount.'; return; }
  const { error } = await sb.rpc('place_bet', { p_character_id: characterId, p_amount: amount });
  if(error){ msg.textContent = error.message; return; }
  msg.style.color = 'var(--green)';
  msg.textContent = 'Bet placed!';
  loadRace();
}

async function ensureProfilesLoaded(userIds){
  const missing = [...new Set(userIds)].filter(id => id && !profilesCache[id]);
  if(!missing.length) return;
  const { data } = await sb.from('profiles').select('*').in('user_id', missing);
  (data || []).forEach(p => { profilesCache[p.user_id] = p; });
  missing.forEach(id => { if(!profilesCache[id]) profilesCache[id] = { user_id: id }; });
}
async function loadMessages(){
  const { data } = await sb.from('messages').select('*').order('created_at', { ascending: false }).limit(50);
  messages = (data || []).reverse();
  await ensureProfilesLoaded(messages.map(m => m.user_id));
  renderMessages();
}
function subscribeMessages(){
  if(messagesSubscribed) return;
  messagesSubscribed = true;
  sb.channel('messages-live')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, async payload=>{
      messages.push(payload.new);
      if(messages.length > 200) messages.shift();
      await ensureProfilesLoaded([payload.new.user_id]);
      renderMessages();
    })
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'messages'}, payload=>{
      messages = messages.filter(m => m.id !== payload.old.id);
      renderMessages();
    })
    .subscribe();
}
function renderMessages(){
  const list = document.getElementById('messageList');
  list.innerHTML = messages.map(m=>{
    const canDelete = isAdmin || m.user_id === myId;
    const time = new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const p = profilesCache[m.user_id] || {};
    const avatarSrc = p.avatar_url || DEFAULT_AVATAR;
    const displayName = p.display_name || m.username;
    return `<div class="msg-row">
      <div class="msg-meta">
        <span class="msg-sender" onclick="openProfileView('${m.user_id}')">
          <img src="${avatarSrc}" class="avatar msg-avatar">
          <span>${escapeHtml(displayName)}${adminBadge(m.user_id)}</span>
        </span>
        <span>${time}${canDelete ? ` &middot; <button class="msg-del" onclick="deleteMessage(${m.id})">delete</button>` : ''}</span>
      </div>
      <div class="msg-body">${escapeHtml(m.body)}</div>
    </div>`;
  }).join('');
  list.scrollTop = list.scrollHeight;
}
function buildSparklineSvg(prices){
  if(!prices.length) return '<div class="empty">Not enough history yet.</div>';
  const w = 320, h = 80, pad = 6;
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = (max - min) || 1;
  const stepX = prices.length > 1 ? (w - 2*pad) / (prices.length - 1) : 0;
  const pts = prices.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h - pad - ((p - min) / range) * (h - 2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const trendUp = prices[prices.length-1] >= prices[0];
  const stroke = trendUp ? 'var(--green)' : 'var(--red)';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:80px;display:block;">
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
async function openStockView(id){
  const overlay = document.getElementById('viewProfileOverlay');
  const card = document.getElementById('viewProfileCard');
  card.innerHTML = '<div class="sub">Loading…</div>';
  overlay.style.display = 'flex';
  const c = market.characters.find(x => x.id === id);
  if(!c){ closeProfileView(); return; }
  await ensureProfilesLoaded([c.created_by]);
  const creator = profilesCache[c.created_by] || {};
  const { data: history } = await sb.from('price_history').select('price, recorded_at').eq('character_id', id).order('recorded_at', { ascending: true }).limit(200);
  const prices = (history || []).map(p => Number(p.price));
  const chg = c.prev > 0 ? ((c.price - c.prev) / c.prev * 100) : 0;
  const dir = chg >= 0 ? 'up' : 'down';
  card.innerHTML = `
    <img src="${c.image_url || DEFAULT_CARD_IMG}" style="width:100%;height:220px;object-fit:cover;border-radius:3px;margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
      <div style="font-weight:600;font-size:16px;">${escapeHtml(c.name)}</div>
      <div class="${dir}" style="font-size:14px;">${fmt(c.price)} (${chg>=0?'+':''}${chg.toFixed(1)}%)</div>
    </div>
    <div class="sub" style="font-size:11px;margin:4px 0 12px;">Created by <span style="cursor:pointer;color:var(--ink);text-decoration:underline;" onclick="closeProfileView(); openProfileView('${c.created_by}')">${escapeHtml(creator.display_name || 'Unknown')}</span>${adminBadge(c.created_by)} &middot; Float: ${Math.floor(c.pool_shares).toLocaleString()} shares</div>
    <div class="section-title" style="margin-bottom:6px;">Recent Trend</div>
    ${buildSparklineSvg(prices)}
    <button style="margin-top:14px;background:transparent;border:1px solid var(--line);color:var(--dim);width:100%;" onclick="closeProfileView()">Close</button>
  `;
}
async function openProfileView(userId){
  const overlay = document.getElementById('viewProfileOverlay');
  const card = document.getElementById('viewProfileCard');
  card.innerHTML = '<div class="sub">Loading…</div>';
  overlay.style.display = 'flex';
  await ensureProfilesLoaded([userId]);
  const p = profilesCache[userId] || {};
  const { data: pf } = await sb.from('portfolios').select('*').eq('user_id', userId).maybeSingle();
  const holdings = (pf && pf.holdings) || {};
  let netWorth = pf ? Number(pf.cash) : 0;
  const rows = Object.entries(holdings).map(([cid, h])=>{
    const c = market.characters.find(x => x.id === cid);
    if(!c || !h.qty) return '';
    const value = h.qty * c.price;
    netWorth += value;
    return `<div class="holding"><span>${escapeHtml(c.name)} ×${h.qty}</span><span>${fmt(value)}</span></div>`;
  }).join('');
  const favChar = p.favorite_character_id ? market.characters.find(c => c.id === p.favorite_character_id) : null;
  card.innerHTML = `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;">
      <img src="${p.avatar_url || DEFAULT_AVATAR}" class="avatar" style="width:48px;height:48px;">
      <div>
        <div style="font-weight:600;">${escapeHtml(p.display_name || 'Trader')}${adminBadge(userId)}</div>
        ${favChar ? `<div class="sub" style="font-size:11px;">Favorite: ${escapeHtml(favChar.name)}</div>` : ''}
      </div>
    </div>
    ${p.bio ? `<div style="font-size:13px;margin-bottom:12px;">${escapeHtml(p.bio)}</div>` : ''}
    <div class="section-title" style="margin-bottom:6px;">Holdings</div>
    ${rows || '<div class="empty">No positions.</div>'}
    <div class="holding" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;"><span>Net worth</span><span>${fmt(netWorth)}</span></div>
    <button style="margin-top:14px;background:transparent;border:1px solid var(--line);color:var(--dim);width:100%;" onclick="closeProfileView()">Close</button>
  `;
}
function closeProfileView(){
  document.getElementById('viewProfileOverlay').style.display = 'none';
}
async function sendMessage(){
  const input = document.getElementById('messageInput');
  const body = input.value.trim().slice(0,500);
  if(!body) return;
  input.value = '';
  const username = profile.display_name || session.user.user_metadata?.username || 'Anonymous';
  await sb.from('messages').insert({ user_id: myId, username, body });
}
async function deleteMessage(id){
  await sb.from('messages').delete().eq('id', id);
}

let headlineTimer;
function flashHeadline(text, type){
  const bar = document.getElementById('headlineBar');
  bar.textContent = text;
  bar.classList.remove('crash','boom');
  if(type === 'crash' || type === 'boom') bar.classList.add(type);
  bar.classList.add('show');
  clearTimeout(headlineTimer);
  headlineTimer = setTimeout(()=>bar.classList.remove('show'), 5000);
}

// init
(async () => {
  const { data: { session: s } } = await sb.auth.getSession();
  session = s;
  onAuthChange();
})();
</script>
